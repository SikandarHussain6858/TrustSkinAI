# Ablation A: UncertaintyCNN + Augmentation + Class-Weighted Cross-Entropy
# Isolates architectural regularization & imbalance handling before MC Dropout / calibration.

_base_: "base.yaml"

experiment:
  name: "ablation_weighted_aug"

dataset:
  augment: true

model:
  type: "uncertainty_cnn"
  in_channels: 3
  num_classes: 7
  dropout_p: 0.25

training:
  epochs: 30
  optimizer: "adamw"
  lr: 0.001
  weight_decay: 0.0001
  loss: "weighted_ce"
  scheduler: "cosine"
  early_stopping_patience: 7
  selection_metric: "val_loss"
