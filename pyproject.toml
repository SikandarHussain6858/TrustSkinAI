[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustskin"
version = "0.1.0"
description = "TrustSkin AI — Reliable Recognition of Difficult Skin Lesions (CS320 Fall 2026, P08)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alap Gohar" },
    { name = "Muhammad Sikandar Hussain" },
    { name = "Shaheer Muzaffar Khan" },
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "medimeta>=0.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
